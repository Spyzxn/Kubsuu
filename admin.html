<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>หลังร้าน - คุดสึหม่าล่าทอด</title>

<style>
*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

body{
  margin:0;
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display",
  "Segoe UI",sans-serif;
  background:#f5f5f7;
  color:#1d1d1f;
}

.container{
  width:min(100%,1100px);
  margin:auto;
  padding:18px;
}

header{
  background:rgba(255,255,255,.88);
  backdrop-filter:blur(20px);
  -webkit-backdrop-filter:blur(20px);
  position:sticky;
  top:0;
  z-index:20;
  border-bottom:1px solid #ddd;
}

.head{
  width:min(100%,1100px);
  margin:auto;
  padding:16px 18px;
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.logo{
  font-size:22px;
  font-weight:800;
}

.sub{
  color:#777;
  font-size:13px;
  margin-top:2px;
}

.section{
  margin-top:18px;
}

.section-title{
  font-size:20px;
  font-weight:800;
  margin-bottom:12px;
}

.stats{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:12px;
}

.stat{
  background:white;
  border-radius:20px;
  padding:18px;
  box-shadow:0 3px 15px rgba(0,0,0,.05);
}

.stat-label{
  font-size:13px;
  color:#777;
}

.stat-value{
  font-size:28px;
  font-weight:800;
  margin-top:5px;
}

.add-btn{
  width:100%;
  border:0;
  background:#007aff;
  color:white;
  padding:15px;
  border-radius:16px;
  font-size:16px;
  font-weight:700;
  cursor:pointer;
}

.product{
  background:white;
  border-radius:20px;
  padding:16px;
  margin-bottom:12px;
  box-shadow:0 3px 15px rgba(0,0,0,.05);
}

.product-top{
  display:flex;
  justify-content:space-between;
  gap:10px;
}

.product-name{
  font-size:18px;
  font-weight:800;
}

.product-info{
  color:#777;
  font-size:14px;
  margin-top:5px;
}

.badge{
  padding:6px 10px;
  border-radius:20px;
  font-size:12px;
  font-weight:700;
  white-space:nowrap;
  height:max-content;
}

.on{
  background:#e7f8ed;
  color:#16803c;
}

.off{
  background:#ffe9e9;
  color:#c62828;
}

.stock{
  margin-top:12px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
}

.stock-number{
  font-size:20px;
  font-weight:800;
}

.stock-buttons{
  display:flex;
  gap:7px;
}

.small-btn{
  border:0;
  width:42px;
  height:38px;
  border-radius:12px;
  background:#f1f1f3;
  font-size:20px;
  font-weight:700;
  cursor:pointer;
}

.actions{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:8px;
  margin-top:12px;
}

.action-btn{
  border:0;
  padding:12px;
  border-radius:12px;
  font-weight:700;
  cursor:pointer;
}

.edit{
  background:#eef5ff;
  color:#007aff;
}

.toggle{
  background:#f2f2f2;
  color:#333;
}

.delete{
  background:#fff0f0;
  color:#d00;
  grid-column:1/3;
}

.order{
  background:white;
  border-radius:20px;
  padding:16px;
  margin-bottom:12px;
  box-shadow:0 3px 15px rgba(0,0,0,.05);
}

.order-head{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:10px;
}

.order-number{
  font-size:20px;
  font-weight:800;
}

.order-time{
  font-size:12px;
  color:#888;
}

.items{
  margin-top:12px;
  padding:12px;
  background:#f7f7f8;
  border-radius:14px;
}

.item{
  display:flex;
  justify-content:space-between;
  padding:5px 0;
}

.customer{
  margin-top:12px;
  font-size:14px;
  line-height:1.7;
}

.total{
  margin-top:10px;
  font-size:20px;
  font-weight:800;
  text-align:right;
}

.status-buttons{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:6px;
  margin-top:12px;
}

.status-btn{
  border:0;
  padding:10px 4px;
  border-radius:10px;
  font-size:12px;
  font-weight:700;
  cursor:pointer;
  background:#eee;
}

.status-active{
  background:#007aff;
  color:white;
}

.empty{
  text-align:center;
  color:#888;
  padding:30px;
}

.modal{
  display:none;
  position:fixed;
  inset:0;
  z-index:100;
  background:rgba(0,0,0,.4);
  backdrop-filter:blur(8px);
  align-items:flex-end;
  justify-content:center;
}

.modal.show{
  display:flex;
}

.modal-box{
  background:white;
  width:min(100%,600px);
  border-radius:26px 26px 0 0;
  padding:22px;
  max-height:90vh;
  overflow:auto;
}

.modal-title{
  font-size:22px;
  font-weight:800;
  margin-bottom:18px;
}

label{
  display:block;
  font-size:13px;
  color:#666;
  margin:12px 0 6px;
}

input,select{
  width:100%;
  border:1px solid #ddd;
  background:#f7f7f8;
  border-radius:13px;
  padding:13px;
  font-size:16px;
  outline:none;
}

.modal-buttons{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
  margin-top:18px;
}

.save{
  background:#007aff;
  color:white;
}

.cancel{
  background:#eee;
}

@media(max-width:600px){
  .stats{
    grid-template-columns:1fr;
  }

  .status-buttons{
    grid-template-columns:repeat(2,1fr);
  }
}
</style>
</head>

<body>

<header>
  <div class="head">
    <div>
      <div class="logo">คุดสึหม่าล่าทอด</div>
      <div class="sub">ระบบจัดการหลังร้าน</div>
    </div>
  </div>
</header>

<div class="container">

  <!-- สถิติ -->
  <div class="section">
    <div class="stats">

      <div class="stat">
        <div class="stat-label">ออเดอร์ทั้งหมด</div>
        <div class="stat-value" id="orderCount">0</div>
      </div>

      <div class="stat">
        <div class="stat-label">กำลังดำเนินการ</div>
        <div class="stat-value" id="pendingCount">0</div>
      </div>

      <div class="stat">
        <div class="stat-label">ยอดรวม</div>
        <div class="stat-value" id="salesTotal">฿0</div>
      </div>

    </div>
  </div>

  <!-- จัดการเมนู -->
  <div class="section">

    <div class="section-title">จัดการเมนู</div>

    <button class="add-btn" onclick="openAddProduct()">
      ＋ เพิ่มเมนูใหม่
    </button>

    <div id="productsList" style="margin-top:12px"></div>

  </div>

  <!-- ออเดอร์ -->
  <div class="section">

    <div class="section-title">ออเดอร์</div>

    <div id="ordersList"></div>

  </div>

</div>


<!-- Modal เพิ่ม/แก้ไขเมนู -->

<div class="modal" id="productModal">

  <div class="modal-box">

    <div class="modal-title" id="modalTitle">
      เพิ่มเมนู
    </div>

    <input type="hidden" id="productId">

    <label>ชื่อเมนู</label>
    <input id="productName" placeholder="เช่น สันคอ">

    <label>ราคา</label>
    <input id="productPrice" type="number" min="0" placeholder="10">

    <label>หมวดหมู่</label>
    <select id="productCategory">
      <option value="meat">🥩 เนื้อ</option>
      <option value="sea">🦑 ทะเล</option>
      <option value="veg">🥦 ผัก</option>
    </select>

    <label>จำนวนสต็อก</label>
    <input id="productStock" type="number" min="0" placeholder="20">

    <label>รูปภาพ</label>
    <input id="productImage" placeholder="images/example.jpg">

    <div class="modal-buttons">

      <button class="action-btn cancel" onclick="closeModal()">
        ยกเลิก
      </button>

      <button class="action-btn save" onclick="saveProduct()">
        บันทึก
      </button>

    </div>

  </div>

</div>


<script type="module">

import { initializeApp }
from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";

import {
  getFirestore,
  collection,
  doc,
  onSnapshot,
  setDoc,
  updateDoc,
  deleteDoc,
  query,
  orderBy
}
from "https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";


/* =========================
   FIREBASE
========================= */

const firebaseConfig = {
  apiKey: "AIzaSyAOcPmnQrhHh058ozPrb1CgvUI1pOesU",
  authDomain: "mala-order-645ed.firebaseapp.com",
  projectId: "mala-order-645ed",
  storageBucket: "mala-order-645ed.firebasestorage.app",
  messagingSenderId: "897411378069",
  appId: "1:897411378069:web:81c0db8a0b5c899a4c649c",
  measurementId: "G-276HMQGECP"
};

const app = initializeApp(firebaseConfig);

const db = getFirestore(app);


/* =========================
   ELEMENTS
========================= */

const productsList =
document.getElementById("productsList");

const ordersList =
document.getElementById("ordersList");


/* =========================
   PRODUCTS
========================= */

onSnapshot(
  collection(db,"products"),
  snapshot => {

    const products = [];

    snapshot.forEach(item => {

      products.push({
        id:item.id,
        ...item.data()
      });

    });

    products.sort((a,b)=>
      String(a.name || "").localeCompare(
        String(b.name || ""),
        "th"
      )
    );

    renderProducts(products);

  },
  error => {

    console.error(error);

    productsList.innerHTML =
      `<div class="empty">
        โหลดเมนูไม่สำเร็จ
      </div>`;

  }
);


/* =========================
   RENDER PRODUCTS
========================= */

function renderProducts(products){

  if(!products.length){

    productsList.innerHTML =
      `<div class="empty">
        ยังไม่มีเมนู
      </div>`;

    return;
  }

  productsList.innerHTML =
    products.map(p => {

      const active =
        p.active !== false;

      return `

      <div class="product">

        <div class="product-top">

          <div>

            <div class="product-name">
              ${escapeHtml(p.name || "ไม่มีชื่อ")}
            </div>

            <div class="product-info">
              ฿${Number(p.price || 0)}
              · ${categoryName(p.category)}
            </div>

          </div>

          <div class="badge ${active ? "on":"off"}">
            ${active ? "กำลังขาย":"ปิดขาย"}
          </div>

        </div>


        <div class="stock">

          <div>
            สต็อก
            <div class="stock-number">
              ${Number(p.stock || 0)}
            </div>
          </div>

          <div class="stock-buttons">

            <button
              class="small-btn"
              onclick="changeStock('${p.id}',-1)">
              −
            </button>

            <button
              class="small-btn"
              onclick="changeStock('${p.id}',1)">
              ＋
            </button>

          </div>

        </div>


        <div class="actions">

          <button
            class="action-btn edit"
            onclick='editProduct(${JSON.stringify({
              id:p.id,
              name:p.name || "",
              price:p.price || 0,
              category:p.category || "meat",
              stock:p.stock || 0,
              image:p.image || "",
              active:p.active !== false
            })})'>
            ✏️ แก้ไข
          </button>

          <button
            class="action-btn toggle"
            onclick="toggleProduct('${p.id}',${active})">
            ${active ? "🔴 ปิดขาย":"🟢 เปิดขาย"}
          </button>

          <button
            class="action-btn delete"
            onclick="removeProduct('${p.id}')">
            🗑️ ลบเมนู
          </button>

        </div>

      </div>

      `;

    }).join("");

}


/* =========================
   ADD PRODUCT
========================= */

window.openAddProduct = function(){

  document.getElementById("modalTitle")
    .textContent = "เพิ่มเมนู";

  document.getElementById("productId")
    .value = "";

  document.getElementById("productName")
    .value = "";

  document.getElementById("productPrice")
    .value = "10";

  document.getElementById("productCategory")
    .value = "meat";

  document.getElementById("productStock")
    .value = "0";

  document.getElementById("productImage")
    .value = "";

  document.getElementById("productModal")
    .classList.add("show");

};


/* =========================
   EDIT PRODUCT
========================= */

window.editProduct = function(p){

  document.getElementById("modalTitle")
    .textContent = "แก้ไขเมนู";

  document.getElementById("productId")
    .value = p.id;

  document.getElementById("productName")
    .value = p.name;

  document.getElementById("productPrice")
    .value = p.price;

  document.getElementById("productCategory")
    .value = p.category;

  document.getElementById("productStock")
    .value = p.stock;

  document.getElementById("productImage")
    .value = p.image;

  document.getElementById("productModal")
    .classList.add("show");

};


/* =========================
   SAVE PRODUCT
========================= */

window.saveProduct = async function(){

  const id =
    document.getElementById("productId").value.trim();

  const name =
    document.getElementById("productName").value.trim();

  const price =
    Number(document.getElementById("productPrice").value);

  const category =
    document.getElementById("productCategory").value;

  const stock =
    Number(document.getElementById("productStock").value);

  const image =
    document.getElementById("productImage").value.trim();


  if(!name){

    alert("กรุณาใส่ชื่อเมนู");

    return;
  }


  if(price < 0 || stock < 0){

    alert("ราคาและสต็อกต้องไม่ติดลบ");

    return;
  }


  try{

    const productId =
      id || "product_" + Date.now();


    const ref =
      doc(db,"products",productId);


    const data = {

      name,
      price,
      category,
      stock,
      image,
      active:true

    };


    if(id){

      await updateDoc(ref,data);

    }else{

      await setDoc(ref,data);

    }


    closeModal();

    alert("บันทึกเมนูเรียบร้อย");

  }catch(error){

    console.error(error);

    alert("บันทึกไม่สำเร็จ");

  }

};


/* =========================
   CHANGE STOCK
========================= */

window.changeStock = async function(id,amount){

  try{

    const ref =
      doc(db,"products",id);

    const productSnapshot =
      await new Promise(resolve => {

        const unsubscribe =
          onSnapshot(ref,snapshot => {

            unsubscribe();

            resolve(snapshot);

          });

      });


    if(!productSnapshot.exists()) return;


    const data =
      productSnapshot.data();

    const current =
      Number(data.stock || 0);

    const next =
      Math.max(0,current + amount);


    await updateDoc(ref,{
      stock:next
    });

  }catch(error){

    console.error(error);

    alert("แก้สต็อกไม่สำเร็จ");

  }

};


/* =========================
   TOGGLE
========================= */

window.toggleProduct =
async function(id,current){

  try{

    await updateDoc(
      doc(db,"products",id),
      {
        active:!current
      }
    );

  }catch(error){

    console.error(error);

    alert("เปลี่ยนสถานะไม่สำเร็จ");

  }

};


/* =========================
   DELETE
========================= */

window.removeProduct =
async function(id){

  const ok =
    confirm(
      "ต้องการลบเมนูนี้จริงหรือไม่?"
    );

  if(!ok) return;


  try{

    await deleteDoc(
      doc(db,"products",id)
    );

  }catch(error){

    console.error(error);

    alert("ลบเมนูไม่สำเร็จ");

  }

};


/* =========================
   MODAL
========================= */

window.closeModal = function(){

  document.getElementById("productModal")
    .classList.remove("show");

};


/* =========================
   ORDERS
========================= */

const ordersQuery =
  query(
    collection(db,"orders"),
    orderBy("createdAt","desc")
  );


onSnapshot(
  ordersQuery,
  snapshot => {

    let totalSales = 0;
    let pending = 0;

    const orders = [];

    snapshot.forEach(item => {

      const data = item.data();

      orders.push({
        id:item.id,
        ...data
      });

      totalSales +=
        Number(data.total || 0);

      if(
        data.status !== "รับแล้ว"
      ){

        pending++;

      }

    });


    document.getElementById("orderCount")
      .textContent = orders.length;

    document.getElementById("pendingCount")
      .textContent = pending;

    document.getElementById("salesTotal")
      .textContent =
        "฿" + totalSales.toLocaleString();


    renderOrders(orders);

  },
  error => {

    console.error(error);

    ordersList.innerHTML =
      `<div class="empty">
        โหลดออเดอร์ไม่สำเร็จ
      </div>`;

  }
);


/* =========================
   RENDER ORDERS
========================= */

function renderOrders(orders){

  if(!orders.length){

    ordersList.innerHTML =
      `<div class="empty">
        ยังไม่มีออเดอร์
      </div>`;

    return;
  }


  ordersList.innerHTML =
    orders.map(order => {

      const items =
        order.items || [];

      const status =
        order.status || "รับออเดอร์";


      let time = "";

      if(order.createdAt){

        try{

          time =
            order.createdAt
              .toDate()
              .toLocaleString("th-TH");

        }catch(e){}

      }


      return `

      <div class="order">

        <div class="order-head">

          <div class="order-number">
            ${escapeHtml(
              order.orderNumber || order.id
            )}
          </div>

          <div class="order-time">
            ${time}
          </div>

        </div>


        <div class="items">

          ${items.map(item => `

            <div class="item">

              <span>
                ${escapeHtml(item.name || "")}
                × ${Number(item.qty || 0)}
              </span>

              <span>
                ฿${Number(
                  item.price || 0
                ) * Number(item.qty || 0)}
              </span>

            </div>

          `).join("")}

        </div>


        <div class="customer">

          👤
          ${escapeHtml(
            order.customer?.name || "-"
          )}

          <br>

          📞
          ${escapeHtml(
            order.customer?.phone || "-"
          )}

          <br>

          🌶️
          ${escapeHtml(
            order.spice || "-"
          )}

          <br>

          💳
          ${escapeHtml(
            order.payment || "-"
          )}

          ${
            order.customer?.note
            ?
            `<br>📝 ${escapeHtml(
              order.customer.note
            )}`
            :
            ""
          }

        </div>


        <div class="total">
          ฿${Number(
            order.total || 0
          ).toLocaleString()}
        </div>


        <div class="status-buttons">

          ${statusButton(
            order.id,
            "รับออเดอร์",
            status
          )}

          ${statusButton(
            order.id,
            "กำลังทอด",
            status
          )}

          ${statusButton(
            order.id,
            "พร้อมรับ",
            status
          )}

          ${statusButton(
            order.id,
            "รับแล้ว",
            status
          )}

        </div>

      </div>

      `;

    }).join("");

}


/* =========================
   STATUS
========================= */

function statusButton(
  id,
  value,
  current
){

  return `

    <button
      class="status-btn ${
        current === value
        ? "status-active"
        : ""
      }"
      onclick="setStatus('${id}','${value}')">

      ${value}

    </button>

  `;

}


window.setStatus =
async function(id,status){

  try{

    await updateDoc(
      doc(db,"orders",id),
      {
        status
      }
    );

  }catch(error){

    console.error(error);

    alert("เปลี่ยนสถานะไม่สำเร็จ");

  }

};


/* =========================
   HELPERS
========================= */

function categoryName(category){

  if(category === "meat")
    return "🥩 เนื้อ";

  if(category === "sea")
    return "🦑 ทะเล";

  if(category === "veg")
    return "🥦 ผัก";

  return "อื่นๆ";

}


function escapeHtml(value){

  return String(value ?? "")
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");

}

</script>

</body>
</html>

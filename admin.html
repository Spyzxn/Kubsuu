<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f5f5f7">
<title>หลังร้าน · MALA FRIED</title>

<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{
 --bg:#f5f5f7;--card:#fff;--text:#111;--muted:#777;
 --red:#e53935;--green:#16a34a;--line:#e8e8eb;
}
html,body{margin:0;background:var(--bg);color:var(--text);
font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
button,input,textarea,select{font:inherit}
button{cursor:pointer;border:0}
#loginScreen{min-height:100dvh;display:flex;align-items:center;
justify-content:center;padding:20px}
.loginCard{width:100%;max-width:420px;background:#fff;border-radius:28px;
padding:30px 22px;box-shadow:0 15px 50px #00000012}
.loginBrand{font-size:30px;font-weight:900;text-align:center}
.loginSub{text-align:center;color:#888;margin:5px 0 28px}
.loginTitle{font-size:21px;font-weight:800;margin-bottom:16px}
.loginCard input{width:100%;padding:15px;border:1px solid #ddd;
border-radius:15px;margin-bottom:12px;outline:0;background:#fafafa}
.loginCard input:focus{border-color:#111;background:#fff}
.loginBtn{width:100%;padding:15px;border-radius:16px;background:#111;
color:#fff;font-weight:800;margin-top:5px}
.loginBtn:disabled{opacity:.5}
.loginError{color:#d92d20;background:#fff1f0;padding:11px 13px;
border-radius:12px;font-size:14px;margin:10px 0;display:none}
.loginHint{text-align:center;color:#999;font-size:12px;margin-top:15px}

#adminApp{display:none;min-height:100dvh}
#adminApp.show{display:block}
.app{max-width:620px;margin:auto;padding-bottom:90px}
header{position:sticky;top:0;z-index:20;padding:14px 16px;
background:#f5f5f7dd;backdrop-filter:blur(20px)}
.head{display:flex;align-items:center;justify-content:space-between}
.logo{font-weight:900;font-size:19px}
.email{font-size:11px;color:#888;margin-top:2px}
.logout{padding:9px 12px;border-radius:12px;background:#fff;
border:1px solid var(--line);font-size:12px;font-weight:700}

.page{display:none;padding:10px 16px}
.page.active{display:block}
h1{font-size:28px;margin:12px 0 18px}
h2{font-size:19px;margin:22px 0 12px}
.card{background:var(--card);border-radius:20px;padding:16px;
margin-bottom:12px;box-shadow:0 3px 15px #00000006}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.stat{padding:16px;border-radius:18px;background:#fff}
.stat b{display:block;font-size:25px;margin-top:5px}
.stat span{font-size:12px;color:#888}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px}
.muted{color:#888;font-size:13px}
.btn{padding:11px 15px;border-radius:13px;font-weight:700}
.black{background:#111;color:#fff}
.red{background:var(--red);color:#fff}
.green{background:var(--green);color:#fff}
.gray{background:#f0f0f2}
.full{width:100%}

.switch{width:48px;height:28px;background:#ccc;border-radius:30px;
padding:3px;transition:.2s}
.switch i{display:block;width:22px;height:22px;background:#fff;
border-radius:50%;transition:.2s}
.switch.on{background:#111}
.switch.on i{transform:translateX(20px)}

.product{display:flex;gap:12px;align-items:center;padding:12px 0;
border-bottom:1px solid var(--line)}
.product:last-child{border-bottom:0}
.product img{width:64px;height:64px;border-radius:15px;object-fit:cover;
background:#eee}
.productInfo{flex:1;min-width:0}
.productInfo b{display:block}
.productInfo span{color:#888;font-size:13px}
.actions{display:flex;gap:5px}
.iconBtn{width:34px;height:34px;border-radius:10px;background:#f1f1f3}

.order{padding:15px 0;border-bottom:1px solid var(--line)}
.order:last-child{border-bottom:0}
.orderTop{display:flex;justify-content:space-between;gap:10px}
.orderId{font-weight:800}
.badge{padding:5px 9px;border-radius:9px;background:#eee;font-size:11px}
.orderItems{font-size:13px;color:#555;margin:10px 0}
.total{font-size:19px;font-weight:900}
.orderBtns{display:flex;gap:7px;flex-wrap:wrap;margin-top:10px}

.tabs{display:flex;gap:7px;overflow:auto;margin-bottom:15px}
.tabs button{white-space:nowrap;padding:9px 13px;border-radius:12px;
background:#fff;border:1px solid var(--line)}
.tabs button.active{background:#111;color:#fff}

.field{margin-bottom:13px}
.field label{display:block;font-size:13px;font-weight:700;margin-bottom:6px}
.field input,.field textarea,.field select{
width:100%;padding:13px;border:1px solid #ddd;border-radius:13px;
background:#fafafa;outline:0}
.field textarea{min-height:80px;resize:vertical}

.bottom{position:fixed;bottom:0;left:0;right:0;z-index:30;
background:#ffffffeF;backdrop-filter:blur(20px);border-top:1px solid #ddd}
.bottomIn{max-width:620px;margin:auto;display:grid;grid-template-columns:repeat(4,1fr)}
.navBtn{background:transparent;padding:11px 3px 10px;color:#888;font-size:11px}
.navBtn b{display:block;font-size:20px;margin-bottom:2px}
.navBtn.active{color:#111;font-weight:800}

.modal{position:fixed;inset:0;background:#0007;z-index:50;
display:none;align-items:flex-end}
.modal.show{display:flex}
.modalBox{width:100%;max-width:620px;margin:auto;background:#fff;
border-radius:25px 25px 0 0;padding:20px;max-height:90dvh;overflow:auto}
.preview{width:100%;height:180px;object-fit:cover;border-radius:16px;
background:#eee;margin-bottom:12px}
.close{float:right;width:35px;height:35px;border-radius:50%;background:#eee}
.toast{position:fixed;left:50%;bottom:85px;transform:translateX(-50%);
background:#111;color:#fff;padding:11px 16px;border-radius:14px;
z-index:100;display:none;font-size:13px;white-space:nowrap}
.toast.show{display:block}
.empty{text-align:center;padding:35px;color:#999}
</style>
</head>

<body>

<!-- LOGIN -->
<section id="loginScreen">
 <div class="loginCard">
  <div class="loginBrand">MALA FRIED</div>
  <div class="loginSub">ระบบจัดการหลังร้าน</div>

  <div class="loginTitle">เข้าสู่ระบบ</div>

  <input id="loginEmail" type="email"
   placeholder="อีเมล" autocomplete="username">

  <input id="loginPassword" type="password"
   placeholder="รหัสผ่าน" autocomplete="current-password">

  <div id="loginError" class="loginError"></div>

  <button id="loginBtn" class="loginBtn" onclick="loginAdmin()">
   เข้าสู่ระบบ
  </button>

  <div class="loginHint">สำหรับผู้ดูแลร้านเท่านั้น</div>
 </div>
</section>

<!-- ADMIN -->
<div id="adminApp">
 <div class="app">

  <header>
   <div class="head">
    <div>
     <div class="logo">MALA FRIED</div>
     <div id="adminEmail" class="email"></div>
    </div>
    <button class="logout" onclick="logoutAdmin()">ออกจากระบบ</button>
   </div>
  </header>

  <!-- HOME -->
  <section id="page-home" class="page active">
   <h1>ภาพรวม</h1>

   <div class="grid">
    <div class="stat">
     <span>ออเดอร์ทั้งหมด</span>
     <b id="statOrders">0</b>
    </div>
    <div class="stat">
     <span>รอดำเนินการ</span>
     <b id="statPending">0</b>
    </div>
    <div class="stat">
     <span>เมนูทั้งหมด</span>
     <b id="statProducts">0</b>
    </div>
    <div class="stat">
     <span>ยอดขาย</span>
     <b id="statSales">฿0</b>
    </div>
   </div>

   <h2>สถานะร้าน</h2>
   <div class="card">
    <div class="row">
     <div>
      <b id="storeStatus">เปิดร้าน</b>
      <div class="muted" id="storeMessage">พร้อมรับออเดอร์</div>
     </div>
     <button id="storeSwitch" class="switch on"
      onclick="toggleStore()"><i></i></button>
    </div>
   </div>

   <h2>เมนู</h2>
   <div class="card" id="homeProducts"></div>
  </section>

  <!-- ORDERS -->
  <section id="page-orders" class="page">
   <h1>ออเดอร์</h1>

   <div class="tabs">
    <button onclick="setOrderFilter('all')" data-filter="all"
     class="active">ทั้งหมด</button>
    <button onclick="setOrderFilter('pending')" data-filter="pending">
     รอรับ
    </button>
    <button onclick="setOrderFilter('accepted')" data-filter="accepted">
     กำลังทำ
    </button>
    <button onclick="setOrderFilter('ready')" data-filter="ready">
     พร้อมส่ง
    </button>
    <button onclick="setOrderFilter('done')" data-filter="done">
     เสร็จแล้ว
    </button>
   </div>

   <div class="card" id="ordersList"></div>
  </section>

  <!-- MENU -->
  <section id="page-menu" class="page">
   <div class="row">
    <h1>เมนู</h1>
    <button class="btn black" onclick="newProduct()">+ เพิ่มเมนู</button>
   </div>

   <div class="card" id="menuList"></div>
  </section>

  <!-- SETTINGS -->
  <section id="page-settings" class="page">
   <h1>ตั้งค่า</h1>

   <div class="card">
    <h2 style="margin-top:0">ร้านค้า</h2>

    <div class="field">
     <label>ข้อความสถานะร้าน</label>
     <input id="storeMsg" placeholder="เช่น วันนี้เปิดถึง 22:00">
    </div>

    <button class="btn black full" onclick="saveStore()">
     บันทึกสถานะร้าน
    </button>
   </div>

   <div class="card">
    <h2 style="margin-top:0">โปรโมชั่น</h2>

    <div class="row" style="margin-bottom:15px">
     <b>เปิดโปรโมชั่น</b>
     <button id="promoSwitch" class="switch"
      onclick="togglePromo()"><i></i></button>
    </div>

    <div class="field">
     <label>ข้อความโปรโมชั่น</label>
     <input id="promoText" placeholder="เช่น ซื้อ 10 แถม 1">
    </div>

    <div class="field">
     <label>รูปโปรโมชั่น</label>
     <input id="promoImage" type="file" accept="image/*"
      onchange="previewPromoImage(event)">
    </div>

    <img id="promoPreview" class="preview" style="display:none">

    <button class="btn black full" onclick="savePromotion()">
     บันทึกโปรโมชั่น
    </button>
   </div>
  </section>

 </div>

 <div class="bottom">
  <div class="bottomIn">
   <button class="navBtn active" data-page="home"
    onclick="openPage('home')"><b>⌂</b>หน้าหลัก</button>
   <button class="navBtn" data-page="orders"
    onclick="openPage('orders')"><b>☷</b>ออเดอร์</button>
   <button class="navBtn" data-page="menu"
    onclick="openPage('menu')"><b>＋</b>เมนู</button>
   <button class="navBtn" data-page="settings"
    onclick="openPage('settings')"><b>⚙</b>ตั้งค่า</button>
  </div>
 </div>
</div>

<!-- PRODUCT MODAL -->
<div id="productModal" class="modal">
 <div class="modalBox">
  <button class="close" onclick="closeProduct()">×</button>
  <h2 id="productModalTitle" style="margin-top:0">เพิ่มเมนู</h2>

  <input id="productId" type="hidden">

  <div class="field">
   <label>ชื่อเมนู</label>
   <input id="productName" placeholder="ชื่อเมนู">
  </div>

  <div class="field">
   <label>ราคา</label>
   <input id="productPrice" type="number" min="0"
    placeholder="ราคา">
  </div>

  <div class="field">
   <label>หมวดหมู่</label>
   <input id="productCategory" placeholder="เช่น หม่าล่า">
  </div>

  <div class="field">
   <label>รายละเอียด</label>
   <textarea id="productDesc" placeholder="รายละเอียดเมนู"></textarea>
  </div>

  <div class="field">
   <label>จำนวนสต็อก</label>
   <input id="productStock" type="number" min="0"
    placeholder="จำนวน">
  </div>

  <div class="field">
   <label>รูปเมนู</label>
   <input id="productImage" type="file" accept="image/*"
    onchange="previewProductImage(event)">
  </div>

  <img id="productPreview" class="preview" style="display:none">

  <div class="row" style="margin:12px 0">
   <b>เปิดขาย</b>
   <button id="productSaleSwitch" class="switch on"
    onclick="toggleSwitchEl('productSaleSwitch')"><i></i></button>
  </div>

  <button class="btn black full" onclick="saveProduct()">
   บันทึกเมนู
  </button>
 </div>
</div>

<div id="toast" class="toast"></div>

<script type="module">

import{initializeApp}
from"https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import{
 getFirestore,collection,doc,setDoc,updateDoc,deleteDoc,
 onSnapshot,serverTimestamp,runTransaction
}from"https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

import{
 getAuth,onAuthStateChanged,signInWithEmailAndPassword,signOut
}from"https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";


/* ================= FIREBASE ================= */

const firebaseConfig={
 apiKey:"AIzaSyAOcPmnQrhHh058ozPr1bCgvUI1pOesU",
 authDomain:"mala-order-645ed.firebaseapp.com",
 projectId:"mala-order-645ed",
 storageBucket:"mala-order-645ed.firebasestorage.app",
 messagingSenderId:"897411378069",
 appId:"1:897411378069:web:81c0db8a0b5c899a4c649c",
 measurementId:"G-276HMQGECP"
};

const ADMIN_UID="m9Hp1d49s7SQlsHQmvTsbjf9osN2";

const app=initializeApp(firebaseConfig);
const db=getFirestore(app);
const auth=getAuth(app);


/* ================= DATA ================= */

let products=[];
let orders=[];
let store={open:true,message:""};
let promotion={enabled:false,text:"",image:""};
let orderFilter="all";
let unsubs=[];


/* ================= HELPERS ================= */

const $=id=>document.getElementById(id);

const money=n=>"฿"+Number(n||0).toLocaleString("th-TH");

function toast(t){
 $("toast").textContent=t;
 $("toast").classList.add("show");
 setTimeout(()=>$("toast").classList.remove("show"),2200);
}

function esc(s){
 return String(s??"").replace(/[&<>"']/g,m=>({
  "&":"&amp;","<":"&lt;",">":"&gt;",
  '"':"&quot;","'":"&#039;"
 }[m]));
}

function statusText(s){
 return{
  pending:"รอรับออเดอร์",
  accepted:"กำลังทำ",
  ready:"พร้อมส่ง",
  done:"เสร็จแล้ว",
  cancelled:"ยกเลิก"
 }[s]||s||"ไม่ทราบสถานะ";
}


/* ================= LOGIN ================= */

async function loginAdmin(){

 const email=$("loginEmail").value.trim();
 const password=$("loginPassword").value;
 const btn=$("loginBtn");

 $("loginError").style.display="none";

 if(!email){
  showLoginError("กรุณากรอกอีเมล");
  return;
 }

 if(!password){
  showLoginError("กรุณากรอกรหัสผ่าน");
  return;
 }

 btn.disabled=true;
 btn.textContent="กำลังเข้าสู่ระบบ...";

 try{

  await signInWithEmailAndPassword(auth,email,password);

  $("loginPassword").value="";

 }catch(e){

  console.error("FIREBASE LOGIN ERROR:",e);

  const code=e?.code||"";

  const messages={
   "auth/invalid-credential":
    "อีเมลหรือรหัสผ่านไม่ถูกต้อง",

   "auth/wrong-password":
    "อีเมลหรือรหัสผ่านไม่ถูกต้อง",

   "auth/user-not-found":
    "ไม่พบบัญชีอีเมลนี้ใน Firebase",

   "auth/invalid-email":
    "รูปแบบอีเมลไม่ถูกต้อง",

   "auth/user-disabled":
    "บัญชีนี้ถูกปิดใช้งาน",

   "auth/too-many-requests":
    "ลองเข้าสู่ระบบบ่อยเกินไป กรุณารอสักครู่",

   "auth/operation-not-allowed":
    "Firebase ยังไม่ได้เปิด Email/Password Authentication",

   "auth/network-request-failed":
    "เชื่อมต่อ Firebase ไม่สำเร็จ กรุณาตรวจสอบอินเทอร์เน็ต",

   "auth/internal-error":
    "Firebase เกิดข้อผิดพลาด กรุณาลองใหม่",

   "auth/app-not-authorized":
    "โดเมนเว็บไซต์นี้ยังไม่ได้รับอนุญาตใน Firebase",

   "auth/invalid-api-key":
    "Firebase API Key ไม่ถูกต้อง"
  };

  showLoginError(
   messages[code]||
   `เข้าสู่ระบบไม่สำเร็จ (${code||"unknown"})`
  );

 }finally{

  btn.disabled=false;
  btn.textContent="เข้าสู่ระบบ";

 }
}

function showLoginError(msg){
 $("loginError").textContent=msg;
 $("loginError").style.display="block";
}

window.loginAdmin=loginAdmin;


$("loginEmail").addEventListener("keydown",e=>{
 if(e.key==="Enter")loginAdmin();
});

$("loginPassword").addEventListener("keydown",e=>{
 if(e.key==="Enter")loginAdmin();
});


/* ================= AUTH STATE ================= */

onAuthStateChanged(auth,async user=>{

 if(!user){

  stopAdminListeners();

  $("adminApp").classList.remove("show");
  $("loginScreen").style.display="flex";
  $("adminEmail").textContent="";

  return;
 }

 console.log("LOGIN USER:",user.email);
 console.log("LOGIN UID:",user.uid);

 /* ตรวจสิทธิ์ Admin */

 if(user.uid!==ADMIN_UID){

  showLoginError(
   "เข้าสู่ระบบแล้ว แต่บัญชีนี้ไม่มีสิทธิ์เข้าหลังร้าน"
  );

  try{
   await signOut(auth);
  }catch(e){
   console.error(e);
  }

  return;
 }

 /* ผ่าน */

 $("loginError").style.display="none";
 $("loginScreen").style.display="none";
 $("adminApp").classList.add("show");
 $("adminEmail").textContent=user.email||"ผู้ดูแล";

 startAdminListeners();

});


async function logoutAdmin(){

 try{
  await signOut(auth);

  $("loginEmail").value="";
  $("loginPassword").value="";

 }catch(e){
  console.error(e);
 }
}

window.logoutAdmin=logoutAdmin;


/* ================= FIRESTORE LISTENERS ================= */

function stopAdminListeners(){

 unsubs.forEach(fn=>{
  try{fn()}catch(e){}
 });

 unsubs=[];
 products=[];
 orders=[];
}


function startAdminListeners(){

 stopAdminListeners();


 /* STORE */

 unsubs.push(
  onSnapshot(
   doc(db,"settings","store"),
   snap=>{
    if(snap.exists()){
     store=snap.data()||{};
    }else{
     store={open:true,message:""};
    }

    updateStoreUI();
   },
   err=>{
    console.error("STORE:",err);
    toast("อ่านข้อมูลร้านไม่ได้");
   }
  )
 );


 /* PROMOTION */

 unsubs.push(
  onSnapshot(
   doc(db,"settings","promotion"),
   snap=>{
    if(snap.exists()){
     promotion=snap.data()||{};
    }

    updatePromotionUI();
   },
   err=>{
    console.error("PROMOTION:",err);
   }
  )
 );


 /* PRODUCTS */

 unsubs.push(
  onSnapshot(
   collection(db,"products"),
   snap=>{

    products=snap.docs.map(d=>({
     id:d.id,
     ...d.data()
    }));

    products.sort(
     (a,b)=>(Number(a.sort)||0)-(Number(b.sort)||0)
    );

    renderStats();
    renderMenu();
    renderHomeProducts();

   },
   err=>{
    console.error("PRODUCTS:",err);
    toast("อ่านเมนูไม่ได้: "+err.code);
   }
  )
 );


 /* ORDERS */

 unsubs.push(
  onSnapshot(
   collection(db,"orders"),
   snap=>{

    orders=snap.docs.map(d=>({
     id:d.id,
     ...d.data()
    }));

    orders.sort((a,b)=>{

     const aa=a.createdAt?.seconds||0;
     const bb=b.createdAt?.seconds||0;

     return bb-aa;

    });

    renderStats();
    renderOrders();

   },
   err=>{
    console.error("ORDERS:",err);
    toast("อ่านออเดอร์ไม่ได้: "+err.code);
   }
  )
 );

}


/* ================= NAV ================= */

function openPage(page){

 document.querySelectorAll(".page").forEach(x=>
  x.classList.remove("active")
 );

 const p=$("page-"+page);

 if(p)p.classList.add("active");

 document.querySelectorAll(".navBtn").forEach(x=>{
  x.classList.toggle(
   "active",
   x.dataset.page===page
  );
 });

 window.scrollTo({top:0,behavior:"smooth"});
}

window.openPage=openPage;


/* ================= STORE ================= */

function updateStoreUI(){

 $("storeStatus").textContent=
  store.open?"เปิดร้าน":"ปิดร้าน";

 $("storeMessage").textContent=
  store.message||
  (store.open?"พร้อมรับออเดอร์":"ร้านปิดอยู่");

 $("storeMsg").value=store.message||"";

 $("storeSwitch").classList.toggle(
  "on",
  !!store.open
 );
}

async function toggleStore(){

 const open=!store.open;

 try{

  await setDoc(

function newProduct(){

 $("productModalTitle").textContent="เพิ่มเมนู";

 $("productId").value="";
 $("productName").value="";
 $("productPrice").value="";
 $("productCategory").value="";
 $("productDesc").value="";
 $("productStock").value="";
 $("productImage").value="";

 $("productPreview").style.display="none";

 $("productSaleSwitch").classList.add("on");

 $("productModal").classList.add("show");
}


function editProduct(id){

 const p=products.find(x=>x.id===id);

 if(!p)return;

 $("productModalTitle").textContent="แก้ไขเมนู";

 $("productId").value=p.id;
 $("productName").value=p.name||"";
 $("productPrice").value=p.price||0;
 $("productCategory").value=p.category||"";
 $("productDesc").value=p.description||"";
 $("productStock").value=p.stock??0;
 $("productImage").value="";

 $("productSaleSwitch").classList.toggle(
  "on",
  p.sale!==false
 );

 if(p.image){

  $("productPreview").src=p.image;
  $("productPreview").style.display="block";

 }else{

  $("productPreview").style.display="none";

 }

 $("productModal").classList.add("show");
}


function closeProduct(){
 $("productModal").classList.remove("show");
}

async function saveProduct(){

 const id=$("productId").value.trim();

 const data={
  name:$("productName").value.trim(),
  price:Number($("productPrice").value||0),
  category:$("productCategory").value.trim()||"ทั่วไป",
  description:$("productDesc").value.trim(),
  stock:Number($("productStock").value||0),
  sale:$("productSaleSwitch").classList.contains("on"),
  updatedAt:serverTimestamp()
 };

 if(!data.name){
  toast("กรุณาใส่ชื่อเมนู");
  return;
 }

 try{

  let image=$("productPreview").src||"";

  if(image==="")image="";

  data.image=image;

  if(id){

   await updateDoc(
    doc(db,"products",id),
    data
   );

   toast("แก้ไขเมนูแล้ว");

  }else{

   data.createdAt=serverTimestamp();
   data.sort=products.length;

   const newRef=doc(collection(db,"products"));

   await setDoc(newRef,data);

   toast("เพิ่มเมนูแล้ว");
  }

  closeProduct();

 }catch(e){

  console.error(e);

  if(e.code==="permission-denied"){
   toast("ไม่มีสิทธิ์แก้ไขเมนู");
  }else{
   toast("บันทึกเมนูไม่ได้: "+e.code);
  }

 }
}

async function deleteProduct(id){

 if(!confirm("ต้องการลบเมนูนี้ใช่ไหม?"))return;

 try{

  await deleteDoc(
   doc(db,"products",id)

  toast("ลบไม่ได้: "+e.code);

 }
}


async function moveProduct(id,direction){

 const index=products.findIndex(x=>x.id===id);

 if(index<0)return;

 const next=index+direction;

 if(next<0||next>=products.length)return;

 const a=products[index];
 const b=products[next];

 try{

  await updateDoc(
   doc(db,"products",a.id),
   {sort:next}
  );

  await updateDoc(
   doc(db,"products",b.id),
   {sort:index}
  );

 }catch(e){

  console.error(e);
  toast("จัดลำดับไม่ได้");

 }
}

/* ================= ORDERS ================= */

function setOrderFilter(filter){

 orderFilter=filter;

 document.querySelectorAll("[data-filter]").forEach(b=>{
  b.classList.toggle(
   "active",
   b.dataset.filter===filter
  );
 });

 renderOrders();
}

function renderOrders(){

 const box=$("ordersList");

 let list=orders;

 if(orderFilter!=="all"){
  list=list.filter(o=>
   (o.status||"pending")===orderFilter
  );
 }

 if(!list.length){

  box.innerHTML='<div class="empty">ไม่มีออเดอร์</div>';
  return;

 }

 box.innerHTML=list.map(o=>{

  const items=o.items||o.orderItems||[];

  const itemText=Array.isArray(items)
   ?items.map(i=>
    `${esc(i.name||"เมนู")} × ${Number(i.qty||i.quantity||1)}`
   ).join("<br>")
   :"";

  const status=o.status||"pending";

  return`

   <div class="order">

    <div class="orderTop">

     <div>
      <div class="orderId">
       #${esc(o.orderNumber||o.id.slice(-6))}
      </div>
      <div class="muted">
       ${esc(o.customerName||"ลูกค้า")}
      </div>
     </div>

     <span class="badge">
      ${statusText(status)}
     </span>

    </div>

    <div class="orderItems">
     ${itemText||"ไม่มีรายการสินค้า"}
    </div>

    <div class="total">
     ${money(o.total||o.amount)}
    </div>

    <div class="orderBtns">

     ${
      status==="pending"
      ?`
       <button class="btn green"
        onclick="changeOrderStatus('${o.id}','accepted')">
        รับออเดอร์
       </button>
       <button class="btn red"
        onclick="changeOrderStatus('${o.id}','cancelled')">
        ยกเลิก
       </button>
      `:""
     }

     ${
      status==="accepted"
      ?`
       <button class="btn black"
        onclick="changeOrderStatus('${o.id}','ready')">
        ทำเสร็จแล้ว
       </button>
      `:""
     }

     ${
      status==="ready"
      ?`
       <button class="btn green"
        onclick="changeOrderStatus('${o.id}','done')">
        ส่งมอบแล้ว
       </button>
      `:""
     }

     ${
      o.paymentSlip
      ?`
       <button class="btn gray"
        onclick="verifyPayment('${o.id}',true)">
        ตรวจสลิป
       </button>
      `:""
     }

    </div>

   </div>

  `;

 }).join("");
}


async function verifyPayment(id,verified=true){

 try{

  await updateDoc(
   doc(db,"orders",id),
   {
    paymentVerified:verified,
    updatedAt:serverTimestamp()
   }
  );

  toast(verified?"ยืนยันการชำระเงินแล้ว":"ยกเลิกการยืนยันแล้ว");

 }catch(e){

  console.error(e);
  toast("ยืนยันการชำระเงินไม่ได้");

 }
}


async function changeOrderStatus(id,status){

 const order=orders.find(o=>o.id===id);

 if(!order)return;

 try{

  /*
   * ถ้ารับออเดอร์ครั้งแรก
   * ตัดสต็อกด้วย transaction
   */

  if(status==="accepted" && order.status==="pending"){

   await runTransaction(db,async tx=>{

    const ref=doc(db,"orders",id);
    const snap=await tx.get(ref);

    if(!snap.exists())
     throw new Error("ไม่พบออเดอร์");

    const current=snap.data();

    if(current.status!=="pending")
     throw new Error("ออเดอร์นี้ถูกดำเนินการแล้ว");

    const items=current.items||current.orderItems||[];

    for(const item of items){

     const productId=item.productId||item.id;

     if(!productId)continue;

     const pRef=doc(db,"products",productId);
     const pSnap=await tx.get(pRef);

     if(!pSnap.exists())continue;

     const p=pSnap.data();

     const qty=Number(item.qty||item.quantity||1);
     const stock=Number(p.stock??0);

     if(stock<qty){
      throw new Error(
       `สต็อก ${p.name||"สินค้า"} ไม่พอ`
      );
     }

     tx.update(
      pRef,
      {
       stock:stock-qty,
       updatedAt:serverTimestamp()
      }
     );
    }

    tx.update(
     ref,
     {
      status:"accepted",
      updatedAt:serverTimestamp()
     }
    );

   });

  }else{

   await updateDoc(
    doc(db,"orders",id),
    {
     status,
     updatedAt:serverTimestamp()
    }
   );

  }

  toast("อัปเดตออเดอร์แล้ว");

 }catch(e){

  console.error(e);

  toast(
   e.message&&e.message.includes("สต็อก")
   ?e.message
   :"อัปเดตออเดอร์ไม่ได้: "+(e.code||e.message||"error")
  );

 }
}

window.setOrderFilter=setOrderFilter;
window.verifyPayment=verifyPayment;
window.changeOrderStatus=changeOrderStatus;


/* ================= IMAGE ================= */

function compressImage(file){

 return new Promise((resolve,reject)=>{

  const reader=new FileReader();

  reader.onload=e=>{

   const img=new Image();

   img.onload=()=>{

    const max=900;

    let w=img.width;
    let h=img.height;

    if(w>max){

     h=h*max/w;
     w=max;

    }

    const canvas=document.createElement("canvas");

    canvas.width=w;
    canvas.height=h;

    const ctx=canvas.getContext("2d");

    ctx.drawImage(img,0,0,w,h);

    resolve(
     canvas.toDataURL("image/jpeg",.72)
    );

   };

   img.onerror=reject;
   img.src=e.target.result;

  };

  reader.onerror=reject;
  reader.readAsDataURL(file);

 });
}
